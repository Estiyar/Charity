    command: ["celery", "-A", "config", "worker", "--beat", "--loglevel=info", "--concurrency", "1"]

  expenses-service:
    build:
      <<: *django-build
      args:
        SERVICE_DIR: services/expenses
    environment:
      <<: *backend-env
      SERVICE_NAME: expenses
      PRIVATE_MEDIA_ROOT: /private_media
    volumes:
      - media_data:/media
