    command: ["celery", "-A", "config", "worker", "--beat", "--loglevel=info", "--concurrency", "1"]

  verification-service:
    build:
      <<: *django-build
      args:
        SERVICE_DIR: services/verification
    environment:
      <<: *backend-env
      SERVICE_NAME: verification
    <<: *django-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 2 --timeout 60"]

  verification-worker:
    profiles: ["workers"]
    build:
      <<: *django-build
      args:
