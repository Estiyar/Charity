services:
  api-gateway:
    ports:
      - "18080:8080"
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:15173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:15173

  frontend:
    build:
      context: ./charity-frontend
      args:
        VITE_API_URL: http://localhost:18080/api
        VITE_MEDIA_URL: http://localhost:18080
        VITE_ECP_ALLOW_DEV: "true"
    ports:
      - "15173:80"

  identity-service:
    environment:
      ECP_ADAPTER: dev
      MEDICAL_SOURCE_ADAPTER: dev
      PAYMENT_ADAPTER: dev
      PAYOUT_ADAPTER: dev
      PAYMENT_FRONTEND_URL: http://localhost:15173
      PAYMENT_PUBLIC_API_URL: http://localhost:18080

  identity-worker:
    environment:
      ECP_ADAPTER: dev
      MEDICAL_SOURCE_ADAPTER: dev
      PAYMENT_ADAPTER: dev
      PAYOUT_ADAPTER: dev
      PAYMENT_FRONTEND_URL: http://localhost:15173
